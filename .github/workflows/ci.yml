name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token: CI only reads the repo; it never writes to it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Self-checks (scoring, fusion, encoding round-trip)
        run: node lib/riasec.selfcheck.ts

      - name: Type-check & build
        run: npm run build
        env:
          # Build-time placeholders — never used at runtime (real values live in Vercel).
          # Present only so any module-level init has something to read during the build.
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-value-0000
          BETTER_AUTH_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The dev server (and its hermetic DATABASE_URL="") is started by playwright.config.
      - name: End-to-end (Playwright)
        run: npm run test:e2e

  # Build the container image and publish it to GitHub Container Registry, but only
  # after lint/build/e2e pass and only on a push to main (never on PRs). Uses the
  # built-in GITHUB_TOKEN — no external registry account or stored secret needed.
  publish-image:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write   # scoped to this job only; the rest of the workflow stays read-only
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest for convenience, :<git-sha> as the immutable tag to pin in prod.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
